# Raise the nginx request body limit so multipart file uploads (PAN, RC,
# vehicle front/side images) are not rejected at the proxy with a 413 before
# reaching Express. EB's nginx defaults to 1 MB, which is smaller than the
# images users upload; a 413 from nginx carries no CORS headers, so the browser
# reports it as a misleading "No Access-Control-Allow-Origin" CORS error.
#
# Keep this in sync with the multer fileSize limit in application.routes.ts (10 MB).
client_max_body_size 15M;
